<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript and DOM Manipulation</title>
  <link rel="stylesheet" href="style.css"> <!-- Optional if you want -->
  <script defer src="script.js"></script>
</head>
<body>

  <header>
    <h1 id="main-title">Welcome to My Page</h1>
  </header>

  <main>
    <section>
      <p id="description">This text will be changed by JavaScript!</p>
      <button id="change-text-btn">Change Text</button>
    </section>

    <section>
      <div id="color-box" style="width: 100px; height: 100px; background-color: lightblue;"></div>
      <button id="change-color-btn">Change Color</button>
    </section>

    <section>
      <ul id="item-list">
        <li>Item 1</li>
        <li>Item 2</li>
      </ul>
      <button id="add-item-btn">Add Item</button>
      <button id="remove-item-btn">Remove Last Item</button>
    </section>
  </main>

  <footer>
    <p>Created by You 💻✨</p>
  </footer>

</body>
</html>
